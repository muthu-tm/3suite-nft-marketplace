<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>NFT Marketplace | Unlock Your Digital Creativity, Embrace NFTs Today!</title>

     <!-- SEO Meta Description -->
    <meta name="description" content="Unlock Your Digital Creativity, Embrace NFTs Today!" />

    <!-- Open Graph (OG) Meta Tags for Link Preview -->
    <meta property="og:title" content="NFT Marketplace" />
    <meta property="og:description" content="Unlock Your Digital Creativity, Embrace NFTs Today!" />
    <meta property="og:type" content="website" />
    
    <!-- Update with your actual logo or thumbnail -->
    <meta property="og:image" content="https://www.google.com/url?sa=i&url=https%3A%2F%2Fpngtree.com%2Fso%2Fnft-logo&psig=AOvVaw3YkzYGjNTxGzhOatAIgWOl&ust=1749659398293000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCLiI8q6j540DFQAAAAAdAAAAABAV" />
    
    <!-- Twitter Card for Twitter Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NFT Marketplace" />
    <meta name="twitter:description" content="Unlock Your Digital Creativity, Embrace NFTs Today!" />
    <meta name="twitter:image" content="https://www.google.com/url?sa=i&url=https%3A%2F%2Fpngtree.com%2Fso%2Fnft-logo&psig=AOvVaw3YkzYGjNTxGzhOatAIgWOl&ust=1749659398293000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCLiI8q6j540DFQAAAAAdAAAAABAV" />
  
  </head>
